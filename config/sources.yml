watch_rules:
  - name: Critical routing and internet stability
    priority_level: 3
    notify: true
    notify_cooldown_hours: 12
    categories:
      - A
      - B
    keywords:
      - BGP
      - RPKI
      - route leak
      - routing outage
      - outage
      - DDoS
      - DNSSEC
  - name: Cloud and edge networking
    priority_level: 2
    notify: true
    notify_cooldown_hours: 8
    categories:
      - A
      - B
    keywords:
      - VPC
      - load balancer
      - CDN
      - edge
      - transit gateway
      - private link
  - name: Network automation and observability
    priority_level: 1
    notify: false
    categories:
      - A
      - B
    keywords:
      - NetDevOps
      - automation
      - telemetry
      - OpenTelemetry
      - eBPF
      - Cilium
